query CategoriesWithChildren($language: LanguageCodeEnum!) {
	categories(first: 8, level: 0) {
		edges {
			node {
				id
				name
				slug
				translation(languageCode: $language) {
					name
				}
				children(first: 10) {
					edges {
						node {
							id
							name
							slug
							translation(languageCode: $language) {
								name
							}
						}
					}
				}
			}
		}
	}
}
