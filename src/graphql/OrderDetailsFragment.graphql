fragment OrderDetails on Order {
	id
	number
	created
	total {
		gross {
			amount
			currency
		}
	}
	lines {
		variant {
			id
			name
			product {
				id
				name
				description
				slug
				thumbnail {
					url
					alt
				}
				category {
					id
					name
				}
			}
			pricing {
				price {
					gross {
						amount
						currency
					}
				}
			}
		}
		quantity
	}
	status
	paymentStatus
	# Public metadata — the account order list reads deliveryStage/deliveredAt and
	# returnStatus to decide whether to offer "Request a return" (the server action
	# re-verifies everything against a fresh read).
	metadata {
		key
		value
	}
}
