query OrderTracking($id: ID!) {
	order(id: $id) {
		id
		number
		created
		status
		chargeStatus
		authorizeStatus
		channel {
			slug
		}
		metadata {
			key
			value
		}
		lines {
			id
			productName
			variantName
			quantity
			thumbnail {
				url
				alt
			}
			totalPrice {
				gross {
					amount
					currency
				}
			}
		}
		shippingAddress {
			firstName
			lastName
			streetAddress1
			streetAddress2
			city
			countryArea
			country {
				country
			}
			phone
		}
		total {
			gross {
				amount
				currency
			}
		}
		# Fulfillment.trackingNumber is deliberately NOT queried here — it's for
		# third-party courier tracking (Aramex/DHL); this store delivers
		# in-house, so it's always empty and would have nothing to show.
		fulfillments {
			status
		}
	}
}
