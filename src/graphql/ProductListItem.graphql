fragment ProductListItem on Product {
	id
	name
	translation(languageCode: $language) {
		name
	}
	slug
	pricing {
		priceRange {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
	}
	category {
		id
		name
		translation(languageCode: $language) {
			name
		}
	}
	thumbnail(size: 1024, format: WEBP) {
		url
		alt
	}
}
